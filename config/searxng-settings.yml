# Local, short-lived SearXNG instance used by the production collector.
# Keep only DuckDuckGo enabled: this is intentionally not a metasearch blend.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
server:
  secret_key: "replace-this-at-runtime"
  limiter: false
search:
  formats:
    - html
    - json
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
