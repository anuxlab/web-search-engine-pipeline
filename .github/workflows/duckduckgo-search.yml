name: DuckDuckGo Web Search Collector

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Primary search phrase"
        required: true
        type: string
      result_limit:
        description: "Maximum number of unique results to collect"
        required: true
        type: choice
        options: ["10", "30", "50", "100", "200", "500"]
        default: "50"
      region:
        description: "DuckDuckGo search region"
        required: true
        type: choice
        options: ["in-en", "us-en", "uk-en", "wt-wt"]
        default: "in-en"
      collection_strategy:
        description: "Hybrid uses query diversification first; paginated retains the original single-query method"
        required: true
        type: choice
        options: ["hybrid", "paginated"]
        default: "hybrid"
      additional_queries:
        description: "Optional related search queries (one per line); used by hybrid mode"
        required: false
        type: string
      max_queries:
        description: "Maximum distinct queries in hybrid mode (including primary query)"
        required: true
        type: choice
        options: ["4", "6", "8", "10", "12"]
        default: "8"

permissions:
  contents: write

# Serialize manual runs on the same branch to reduce write-back races.
concurrency:
  group: ddg-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, archive, and commit results
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create run archive and initialize logs
        id: paths
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SEARCH_QUERY: ${{ inputs.search_query }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import datetime, timezone
          from pathlib import Path
          query = os.environ["SEARCH_QUERY"].strip()
          slug = re.sub(r"[^a-zA-Z0-9]+", "-", query).strip("-").lower()[:48] or "query"
          now = datetime.now(timezone.utc)
          run_dir = Path("runs") / now.strftime("%Y/%m/%d") / f"{os.environ['RUN_ID']}-attempt-{os.environ['RUN_ATTEMPT']}-{slug}"
          run_dir.mkdir(parents=True, exist_ok=True)
          (run_dir / "run.log").write_text(
              "DUCKDUCKGO WORKFLOW RUN LOG\n"
              f"Run ID: {os.environ['RUN_ID']}\n"
              f"Attempt: {os.environ['RUN_ATTEMPT']}\n"
              f"Query: {query}\nStarted (UTC): {now.isoformat()}\n\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_dir={run_dir.as_posix()}\n")
          print(f"Run archive: {run_dir}")
          PY

      - name: Install dependencies and run collector
        id: collect
        continue-on-error: true
        env:
          SEARCH_QUERY: ${{ inputs.search_query }}
          RESULT_LIMIT: ${{ inputs.result_limit }}
          SEARCH_REGION: ${{ inputs.region }}
          COLLECTION_STRATEGY: ${{ inputs.collection_strategy }}
          ADDITIONAL_QUERIES: ${{ inputs.additional_queries }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          RUN_DIR: ${{ steps.paths.outputs.run_dir }}
        run: |
          set -o pipefail
          {
            echo "===== RUN ENVIRONMENT ====="
            python --version
            echo "Runner OS: $RUNNER_OS"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "===== INSTALL DEPENDENCIES ====="
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            echo "===== SEARCH COLLECTION ====="
            python src/search_collector.py \
              --query "$SEARCH_QUERY" \
              --limit "$RESULT_LIMIT" \
              --region "$SEARCH_REGION" \
              --strategy "$COLLECTION_STRATEGY" \
              --additional-queries "$ADDITIONAL_QUERIES" \
              --max-queries "$MAX_QUERIES" \
              --page-delay 3.0 \
              --blocked-cooldown 20 \
              --output "$RUN_DIR"
          } 2>&1 | tee -a "$RUN_DIR/run.log"

      - name: Ensure archive files exist
        if: always()
        env:
          RUN_DIR: ${{ steps.paths.outputs.run_dir }}
          QUERY: ${{ inputs.search_query }}
          LIMIT: ${{ inputs.result_limit }}
          REGION: ${{ inputs.region }}
          STRATEGY: ${{ inputs.collection_strategy }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          python - <<'PY' 2>&1 | tee -a "$RUN_DIR/run.log"
          import csv, json, os
          from pathlib import Path
          run_dir = Path(os.environ["RUN_DIR"])
          run_dir.mkdir(parents=True, exist_ok=True)
          defaults = {
              "raw_results.json": {"search_engine":"DuckDuckGo", "strategy":os.environ["STRATEGY"], "pages":[], "raw_results":[], "raw_result_count":0, "pages_succeeded":0, "stop_reason":"collector_did_not_start_or_failed_before_search"},
              "cleaned_results.json": [],
          }
          for name, value in defaults.items():
              path = run_dir / name
              if not path.exists(): path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          csv_path = run_dir / "cleaned_results.csv"
          if not csv_path.exists():
              fields = ["rank","title","url","domain","snippet","query","source_query","region","search_engine","collected_at"]
              with csv_path.open("w", newline="", encoding="utf-8-sig") as handle: csv.DictWriter(handle, fieldnames=fields, lineterminator="\n").writeheader()
          summary = run_dir / "summary.txt"
          if not summary.exists():
              summary.write_text("DUCKDUCKGO SEARCH COLLECTION REPORT\n" f"Status: {os.environ.get('COLLECT_OUTCOME','unknown')}\n" f"Query: {os.environ['QUERY']}\n" f"Requested maximum: {os.environ['LIMIT']}\n" f"Region: {os.environ['REGION']}\n" f"Strategy: {os.environ['STRATEGY']}\nCollector summary unavailable; inspect run.log.\n", encoding="utf-8")
          PY

      - name: Write run metadata
        if: always()
        env:
          RUN_DIR: ${{ steps.paths.outputs.run_dir }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          QUERY: ${{ inputs.search_query }}
          LIMIT: ${{ inputs.result_limit }}
          REGION: ${{ inputs.region }}
          STRATEGY: ${{ inputs.collection_strategy }}
          ADDITIONAL_QUERIES: ${{ inputs.additional_queries }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          python - <<'PY' 2>&1 | tee -a "$RUN_DIR/run.log"
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          run_dir = Path(os.environ["RUN_DIR"])
          metadata = {
              "workflow": "DuckDuckGo Web Search Collector",
              "run_id": os.environ["RUN_ID"], "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_number": int(os.environ["RUN_NUMBER"]), "actor": os.environ["ACTOR"],
              "ref": os.environ["REF"], "commit_sha": os.environ["SHA"],
              "query": os.environ["QUERY"], "requested_limit": int(os.environ["LIMIT"]),
              "region": os.environ["REGION"], "strategy": os.environ["STRATEGY"],
              "additional_queries": [x.strip() for x in os.environ.get("ADDITIONAL_QUERIES", "").splitlines() if x.strip()],
              "max_queries": int(os.environ["MAX_QUERIES"]), "provider_page_size": 10,
              "collector_step_outcome": os.environ["COLLECT_OUTCOME"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          (run_dir / "metadata.json").write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Commit run outputs to repository
        id: writeback
        if: always()
        continue-on-error: true
        env:
          RUN_DIR: ${{ steps.paths.outputs.run_dir }}
        run: bash scripts/archive_run.sh

      - name: Upload complete run archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.run_dir }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Report overall workflow status
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          WRITEBACK_OUTCOME: ${{ steps.writeback.outcome }}
        run: |
          echo "Collector outcome: $COLLECT_OUTCOME"
          echo "Repository write-back outcome: $WRITEBACK_OUTCOME"
          if [[ "$COLLECT_OUTCOME" == "failure" || "$WRITEBACK_OUTCOME" == "failure" ]]; then
            echo "Collection or repository write-back failed. Inspect the run artifact and step logs."
            exit 1
          fi
