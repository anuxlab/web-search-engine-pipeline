name: DuckDuckGo Web Search Collector

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Search phrase to send to DuckDuckGo"
        required: true
        type: string
      result_limit:
        description: "Maximum number of unique results to collect"
        required: true
        type: choice
        options:
          - "10"
          - "30"
          - "50"
          - "100"
          - "200"
          - "500"
        default: "50"
      region:
        description: "DuckDuckGo search region"
        required: true
        type: choice
        options:
          - "in-en"
          - "us-en"
          - "uk-en"
          - "wt-wt"
        default: "in-en"

permissions:
  contents: read

concurrency:
  group: ddg-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect search results
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run collector
        id: collector
        env:
          SEARCH_QUERY: ${{ inputs.search_query }}
          RESULT_LIMIT: ${{ inputs.result_limit }}
          SEARCH_REGION: ${{ inputs.region }}
        run: |
          python src/search_collector.py \
            --query "$SEARCH_QUERY" \
            --limit "$RESULT_LIMIT" \
            --region "$SEARCH_REGION" \
            --output outputs

      - name: Print collection summary
        if: always()
        run: |
          if [ -f outputs/summary.txt ]; then
            cat outputs/summary.txt
          else
            echo "No summary file was produced."
          fi

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-results-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
